<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Gestion Stagiaires{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="/static/logo_acces_vii.svg" alt="Logo Accès VII" class="brand-logo" />
      <h1>Gestion des stagiaires</h1>
    </div>
    <nav>
      <a href="/stagiaires">Stagiaires</a>
      <a href="/sections">Sections</a>
    </nav>
  </header>

  <main>
    {% if request.state.flash %}
      <div class="flash {{ request.state.flash.kind }}">{{ request.state.flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
